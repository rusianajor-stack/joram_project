<main>
  <div class="wrap page-header">
    <h1>My Projects</h1>
    <p>A few things I've built.</p>
  </div>

  <section id="projects">
    <div class="wrap">
      <div class="projects-grid">

        <article class="project-card">
          <figure>
            <img src="images/project-evirs.svg"
                 alt="Placeholder image for Electronic Vehicular Incident Report System project"
>
            <figcaption>
              <h3>Electronic Vehicular Incident Report System</h3>
              <p>A web-based system for reporting vehicular incidents, with photo uploads, location info, report verification, maps, and an admin dashboard.</p>
              <ul class="tech-tags">
                <li>HTML</li><li>CSS</li><li>JavaScript</li><li>MySQL</li>
              </ul>
            </figcaption>
          </figure>
        </article>

        <article class="project-card">
          <figure>
            <img src="images/project-animation.svg"
                 alt="Placeholder image for animation projects"
>
            <figcaption>
              <h3>Animation Projects</h3>
              <p>Animation activities made with Adobe Animate, including Squash and Stretch and Slow In / Slow Out.</p>
              <ul class="tech-tags">
                <li>Adobe Animate</li><li>ActionScript</li>
              </ul>
            </figcaption>
          </figure>
        </article>

        <article class="project-card">
          <figure>
            <img src="images/project-website.jpg"
                 alt="Placeholder image for personal website project"
>
            <figcaption>
              <h3>Personal Website</h3>
              <p>A desktop-linked web application for managing barangay records — including document requests, blotter entries, announcements, and generated reports for residents and staff.</p>
              <ul class="tech-tags">
                <li>HTML</li><li>CSS</li>
              </ul>
            </figcaption>
          </figure>
        </article>

        <article class="project-card">
          <figure>
            <img src="images/project-ad-animation.svg"
                 alt="Placeholder image for Animated Product Advertisement project">
            <figcaption>
              <h3>FOKUS Cold Brew Energy</h3>
              <p>A short animated advertisement made in Adobe Animate, using motion tweens and timing to promote a sample product from start to end screen.</p>
              <p><a href="https://www.facebook.com/share/v/1FWy3YKFXk/" target="_blank" rel="noopener noreferrer">Watch Video on Facebook</a></p>
              <ul class="tech-tags">
                <li>Adobe Animate</li><li>ActionScript</li>
              </ul>
            </figcaption>
          </figure>
        </article>

      </div>
    </div>
